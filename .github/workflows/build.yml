# Builds the executables (npm run dist), tries them, and uploads them as an artifact of the run:
#
# - the Linux executable is started and its API and dashboard checked (scripts/smoke-test.mjs),
#   then installed with the installer into a scratch home folder, started again, and uninstalled;
# - the Windows exe is checked the same way on Windows, in its console and in the background.
#
# Each runs as on a new system: its data folder doesn't exist yet (see the smoke test).
#
# Run by the pull request checks and the release, and by hand for any branch: Actions → Build →
# Run workflow, choosing the branch. The files are then in the run's Artifacts. Built by hand, the
# version has the commit added (0.2.0+abc1234), so these builds can't be mistaken for a release.
name: Build

on:
  workflow_dispatch:
    inputs:
      add-commit:
        description: Add the commit to the version (0.2.0+abc1234)
        type: boolean
        default: true
  workflow_call:
    outputs:
      artifact-name:
        description: The artifact holding the exe and the Linux installer.
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        description: The version built (from package.json).
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build and try on Linux
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          pkg-cache: 'true'

      # Only a run by hand has the input; called by the checks or the release, it's left out.
      - name: Add the commit to the version
        if: inputs.add-commit
        run: echo "::notice::Building version $(node scripts/add-commit-to-version.mjs "$GITHUB_SHA")"

      - name: Names
        id: names
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *+*) echo "artifact-name=ed-journal-tool-$version" >> "$GITHUB_OUTPUT" ;;
            *) echo "artifact-name=ed-journal-tool-$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm run dist

      - name: Check the files
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          ls -l dist
          test -s "dist/ed-journal-tool-$VERSION.exe"
          test -s "dist/ed-journal-tool-$VERSION-linux-x64-install.sh"
          reported=$("dist/ed-journal-tool-$VERSION" --version)
          echo "The Linux executable reports version $reported"
          test "$reported" = "$VERSION"

      - name: Try the Linux executable
        run: node scripts/smoke-test.mjs "dist/ed-journal-tool-${{ steps.names.outputs.version }}"

      - name: Try the Linux installer
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          installer="$PWD/dist/ed-journal-tool-$VERSION-linux-x64-install.sh"
          export HOME="$RUNNER_TEMP/home"
          unset XDG_DATA_HOME XDG_CONFIG_HOME
          mkdir -p "$HOME"
          sh "$installer" --help > /dev/null
          sh "$installer"
          test -x "$HOME/.local/bin/ed-journal-tool"
          grep -q "X-AppVersion=$VERSION" "$HOME/.local/share/applications/ed-journal-tool.desktop"
          node scripts/smoke-test.mjs "$HOME/.local/bin/ed-journal-tool"
          sh "$installer" --uninstall
          test ! -e "$HOME/.local/bin/ed-journal-tool"
          test ! -e "$HOME/.local/share/applications/ed-journal-tool.desktop"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: |
            dist/ed-journal-tool-${{ steps.names.outputs.version }}.exe
            dist/ed-journal-tool-${{ steps.names.outputs.version }}-linux-x64-install.sh
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Try on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      # Both as on a new system (scripts/smoke-test.mjs): in this console, and as when double-clicked
      # (a hidden copy, logging to the data folder, with the tray icon).
      - name: Try the Windows exe
        shell: bash
        env:
          EDJT_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/smoke-test.mjs "dist/ed-journal-tool-${{ needs.build.outputs.version }}.exe" --console --no-tray
      - name: Try the Windows exe in the background
        shell: bash
        env:
          EDJT_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/smoke-test.mjs --background "dist/ed-journal-tool-${{ needs.build.outputs.version }}.exe"
