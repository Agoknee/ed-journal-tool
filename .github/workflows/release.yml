# Each pull request merged into main is released, unless it's labelled "no-release": the
# executables are built and tried (build.yml), their provenance is attested, and they're attached
# to a draft "v<version>" release listing the changes since the last one. Publish the draft on the
# repository's Releases page; that creates the tag.
#
# Until then, a later merge with the same version replaces the draft with a new build. A version
# already published is never touched. Run by hand (Actions → Release → Run workflow, on main),
# it releases whatever the version is, labels aside.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' || true)
            if printf '%s\n' "$labels" | grep -qx 'no-release'; then
              echo "::notice::The pull request is labelled no-release; nothing to release."
              echo "should-release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Published releases have their tag (drafts don't, and aren't visible to this job).
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already published; nothing to release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.should-release == 'true'
    uses: ./.github/workflows/build.yml

  release:
    name: Draft the release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # the certificate the attestation is signed with
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history and tags, for the release notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Checksums
        run: cd dist && sha256sum ed-journal-tool-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Anyone can then check a download came from this workflow: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ed-journal-tool-*.exe
            dist/ed-journal-tool-*-install.sh

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/release-notes.mjs release-notes.md "$TAG"
          # A draft of this version from an earlier merge gives way to this build.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            echo "::notice::Replacing the draft $TAG with this build."
            gh release delete "$TAG" --yes
          fi
          # A version like 1.2.0-beta.1 is marked as a prerelease.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "ED Journal Tool $VERSION" \
            --notes-file release-notes.md \
            "dist/ed-journal-tool-$VERSION.exe" \
            "dist/ed-journal-tool-$VERSION-linux-x64-install.sh" \
            dist/SHA256SUMS.txt
          echo "::notice::Drafted $TAG: publish it on the Releases page."
