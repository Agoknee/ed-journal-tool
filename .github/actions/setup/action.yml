name: Set up EDJT
description: Node.js, the server's and the client's packages, and (optionally) pkg's cached Node.js binaries.

inputs:
  pkg-cache:
    description: Restore and save the Node.js binaries pkg downloads for the executables.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json

    - name: Install packages
      shell: bash
      run: |
        npm ci
        npm ci --prefix client

    # pkg downloads a Node.js binary per target (about 50 MB each) into ~/.pkg-cache.
    - if: inputs.pkg-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pkg-cache
        key: pkg-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: pkg-cache-${{ runner.os }}-
